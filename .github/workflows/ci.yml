name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_secrets.py

  test:
    runs-on: ubuntu-latest
    needs: secret-scan
    strategy: { matrix: { python: ["3.11", "3.12"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: cd backend && pip install -e ".[dev]" && ruff check src tests && pytest --cov=lablens -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t lablens:ci ./backend
